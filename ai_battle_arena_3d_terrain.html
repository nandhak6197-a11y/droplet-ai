<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Battle Arena — 3D (Pollinations vs Groq)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg:#0a0c10;
    --panel:#181c22;
    --grid:#232a33;
    --agentA:#e0a458;
    --agentB:#4fb8c9;
    --muted:#7c8794;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
    --sans: 'Inter', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:#d8dde3;font-family:var(--sans);}
  .wrap{display:flex;flex-direction:column;gap:14px;padding:18px;max-width:1180px;margin:0 auto;}
  .title{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  .title h1{font-size:20px;font-weight:600;margin:0;}
  .title .sub{font-family:var(--mono);font-size:12px;color:var(--muted);}
  .setup{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .agent-card{background:var(--panel);border:1px solid var(--grid);border-radius:6px;padding:12px 14px;}
  .agent-card.a{border-left:3px solid var(--agentA);}
  .agent-card.b{border-left:3px solid var(--agentB);}
  .agent-card label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-family:var(--mono);}
  .agent-card input, .agent-card textarea{
    width:100%;background:#0d1014;border:1px solid var(--grid);color:#d8dde3;
    border-radius:4px;padding:7px 8px;font-family:var(--sans);font-size:13px;resize:vertical;
  }
  .agent-card .name-row{margin-bottom:8px;}
  .agent-card .name-row strong{font-size:14px;}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  button{
    background:#232a33;border:1px solid var(--grid);color:#d8dde3;padding:8px 16px;
    border-radius:4px;font-family:var(--sans);font-size:13px;cursor:pointer;font-weight:500;
  }
  button:hover{background:#2b3340;}
  button:disabled{opacity:0.4;cursor:not-allowed;}
  button.primary{background:var(--agentA);color:#1a1300;border:none;}
  button.primary:hover{background:#eab371;}
  .speed{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--muted);}
  .main{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;}
  .arena-box{background:var(--panel);border:1px solid var(--grid);border-radius:6px;padding:10px;flex:0 0 auto;}
  #canvasHolder{width:680px;height:540px;border-radius:4px;overflow:hidden;background:#05070a;position:relative;cursor:grab;}
  #canvasHolder:active{cursor:grabbing;}
  #canvasHolder canvas{display:block;}
  .cam-hint{position:absolute;bottom:8px;right:10px;font-family:var(--mono);font-size:10px;color:#8a94a0;
    background:rgba(0,0,0,0.45);padding:3px 7px;border-radius:3px;}
  .status-bar{display:flex;justify-content:space-between;margin-top:10px;font-family:var(--mono);font-size:12px;}
  .hp-block{flex:1;}
  .hp-block.a{color:var(--agentA);}
  .hp-block.b{color:var(--agentB);text-align:right;}
  .hp-bar{height:6px;background:#232a33;border-radius:3px;overflow:hidden;margin-top:4px;}
  .hp-fill{height:100%;transition:width 0.3s;}
  .hp-fill.a{background:var(--agentA);}
  .hp-fill.b{background:var(--agentB);}
  .log-panel{flex:1;min-width:280px;background:var(--panel);border:1px solid var(--grid);border-radius:6px;
    padding:12px;height:540px;display:flex;flex-direction:column;}
  .log-panel h3{margin:0 0 8px 0;font-size:12px;font-family:var(--mono);color:var(--muted);font-weight:500;}
  .log-feed{flex:1;overflow-y:auto;display:flex;flex-direction:column-reverse;gap:6px;font-size:12.5px;}
  .log-entry{padding:7px 9px;border-radius:4px;background:#0d1014;border-left:2px solid var(--grid);}
  .log-entry.a{border-left-color:var(--agentA);}
  .log-entry.b{border-left-color:var(--agentB);}
  .log-entry .meta{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-bottom:2px;}
  .log-entry .reasoning{color:#a8b0ba;font-size:12px;margin-top:3px;font-style:italic;}
  .winner-banner{text-align:center;padding:14px;border-radius:6px;font-size:16px;font-weight:600;margin-top:2px;}
  .winner-banner.a{background:rgba(224,164,88,0.12);color:var(--agentA);border:1px solid var(--agentA);}
  .winner-banner.b{background:rgba(79,184,201,0.12);color:var(--agentB);border:1px solid var(--agentB);}
  .winner-banner.draw{background:rgba(124,135,148,0.12);color:var(--muted);border:1px solid var(--grid);}
  .badge{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:3px;}
</style>
</head>
<body>

<div class="wrap">
  <div class="title">
    <h1>AI Battle Arena — 3D Terrain</h1>
    <div class="sub" id="turnCounter">turn 0 / 30</div>
  </div>

  <div class="setup">
    <!-- AGENT A (POLLINATIONS) -->
    <div class="agent-card a">
      <div class="name-row" style="display:flex; justify-content:space-between; align-items:center;">
        <strong style="color:var(--agentA)">Agent A — Pollinations AI</strong>
        <span class="badge" style="background:rgba(224,164,88,0.15); color:var(--agentA);">Pollinations API</span>
      </div>
      <label>Name</label>
      <input id="nameA" value="Pollinations (OSAII)" />
      
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px;">
        <div>
          <label>Model</label>
          <input id="modelA" value="morriszdweck/osaii-api-smart" style="font-family:var(--mono); font-size:11px;" />
        </div>
        <div>
          <label>API Key</label>
          <input id="keyA" value="sk_rCfY3PHvWh9yGcvIokjx1nQtWatKIndV" type="password" style="font-family:var(--mono); font-size:11px;" />
        </div>
      </div>
      
      <label style="margin-top:6px;">Strategy / persona</label>
      <textarea id="stratA" rows="2">Aggressive rusher. Closes distance fast, prefers shooting over cover, takes high risks to overpower the opponent.</textarea>
    </div>

    <!-- AGENT B (GROQ) -->
    <div class="agent-card b">
      <div class="name-row" style="display:flex; justify-content:space-between; align-items:center;">
        <strong style="color:var(--agentB)">Agent B — Groq Cloud</strong>
        <span class="badge" style="background:rgba(79,184,201,0.15); color:var(--agentB);">Groq High-Speed</span>
      </div>
      <label>Name</label>
      <input id="nameB" value="Groq (GPT-OSS 120B)" />
      
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px;">
        <div>
          <label>Model</label>
          <input id="modelB" value="openai/gpt-oss-120b" style="font-family:var(--mono); font-size:11px;" />
        </div>
        <div>
          <label>Active Groq Key</label>
          <input id="keyB" value="" placeholder="Enter Groq API Key..." type="password" style="font-family:var(--mono); font-size:11px;" />
        </div>
      </div>
      
      <label style="margin-top:6px;">Strategy / persona</label>
      <textarea id="stratB" rows="2">Deadly marksman. Utilizes lightning-fast 120B reasoning, controls sightlines, holds strong cover, and eliminates targets with pinpoint accuracy.</textarea>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="startBtn">Start Battle</button>
    <button id="pauseBtn" disabled>Pause</button>
    <button id="resetBtn">Reset</button>
    <div class="speed">
      turn delay
      <input type="range" id="speedSlider" min="300" max="2500" value="800" step="100" style="width:100px;">
      <span id="speedLabel">800ms</span>
    </div>
  </div>

  <div class="main">
    <div class="arena-box">
      <div id="canvasHolder"><div class="cam-hint">drag to orbit · scroll to zoom</div></div>
      <div class="status-bar">
        <div class="hp-block a">
          <span id="hpLabelA">Pollinations — 100</span>
          <div class="hp-bar"><div class="hp-fill a" id="hpFillA" style="width:100%"></div></div>
        </div>
        <div style="width:20px;"></div>
        <div class="hp-block b">
          <span id="hpLabelB">Groq — 100</span>
          <div class="hp-bar"><div class="hp-fill b" id="hpFillB" style="width:100%"></div></div>
        </div>
      </div>
      <div id="winnerBanner"></div>
    </div>

    <div class="log-panel">
      <h3>battle log</h3>
      <div class="log-feed" id="logFeed"></div>
    </div>
  </div>
</div>

<script>
const GRID = 560;
const SCALE = 1/10;
const HALF = GRID * SCALE / 2; // 28
const MAX_TURNS = 30;

// Groq API Keys with automatic failover
const groqKeys = [
  // Add keys here or via input field
];
let currentGroqKeyIdx = 0;

const obstaclesRaw = [
  {x:80, y:200, w:60, h:120},
  {x:420, y:240, w:60, h:120},
  {x:250, y:80, w:120, h:40},
  {x:250, y:440, w:120, h:40},
  {x:260, y:260, w:40, h:40},
];

function toWorld(x, y){ return { x: x*SCALE - HALF, z: y*SCALE - HALF }; }
function freshState(){
  return {
    turn: 0, running: false, over: false,
    A: { x:70, y:70, hp:100, ammo:30, cover:false, name: document.getElementById('nameA')?.value || 'Pollinations' },
    B: { x:490, y:490, hp:100, ammo:30, cover:false, name: document.getElementById('nameB')?.value || 'Groq' },
  };
}
let state = freshState();
function dist(p1,p2){ return Math.hypot(p1.x-p2.x, p1.y-p2.y); }
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function nearCover(p){
  for(const o of obstaclesRaw){
    const cx = Math.max(o.x, Math.min(p.x, o.x+o.w));
    const cy = Math.max(o.y, Math.min(p.y, o.y+o.h));
    if(Math.hypot(p.x-cx,p.y-cy) < 30) return true;
  }
  return false;
}

// ---------- THREE.JS SETUP ----------
let scene, camera, renderer, holder;
let meshA, meshB;
let camAngle = { theta: Math.PI/4, phi: 1.05, radius: 58 };
let dragging = false, lastMouse = {x:0,y:0};
const tracers = [];
const flashLights = [];
let clock;

function makeGroundTexture(){
  const size = 512;
  const c = document.createElement('canvas'); c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#4a5738'; ctx.fillRect(0,0,size,size);
  for(let i=0;i<9000;i++){
    const x = Math.random()*size, y = Math.random()*size;
    const g = 60 + Math.random()*70;
    ctx.fillStyle = `rgba(${g*0.55|0},${g*0.85|0},${g*0.4|0},0.55)`;
    ctx.fillRect(x, y, 1.4, 1.4);
  }
  for(let i=0;i<200;i++){
    const x = Math.random()*size, y = Math.random()*size, r = 4+Math.random()*10;
    ctx.fillStyle = `rgba(70,60,45,0.15)`;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(24,24);
  return tex;
}

function makeCompoundFloorTexture(){
  const size = 512;
  const c = document.createElement('canvas'); c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#5c5442'; ctx.fillRect(0,0,size,size);
  for(let i=0;i<6000;i++){
    const x = Math.random()*size, y = Math.random()*size;
    const g = 70 + Math.random()*50;
    ctx.fillStyle = `rgba(${g},${g*0.9|0},${g*0.75|0},0.4)`;
    ctx.fillRect(x,y,1.2,1.2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(10,10);
  return tex;
}

function makeSky(){
  const geo = new THREE.SphereGeometry(180, 20, 20);
  const pos = geo.attributes.position;
  const colors = [];
  const top = new THREE.Color(0x25344a);
  const horizon = new THREE.Color(0x7a6a52);
  for(let i=0;i<pos.count;i++){
    const t = clamp((pos.getY(i)/180 + 1)/2, 0, 1);
    const col = horizon.clone().lerp(top, Math.pow(t, 0.6));
    colors.push(col.r, col.g, col.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  const mat = new THREE.MeshBasicMaterial({ vertexColors:true, side:THREE.BackSide, fog:false });
  return new THREE.Mesh(geo, mat);
}

function buildTerrain(){
  const size = 220, segs = 70;
  const geo = new THREE.PlaneGeometry(size, size, segs, segs);
  geo.rotateX(-Math.PI/2);
  const pos = geo.attributes.position;
  const innerR = HALF + 6;
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i), z = pos.getZ(i);
    const d = Math.sqrt(x*x+z*z);
    let h = 0;
    if(d > innerR){
      const t = Math.min(1, (d-innerR)/40);
      const n = (Math.sin(x*0.13)+Math.cos(z*0.15)+Math.sin((x+z)*0.07)+Math.cos((x-z)*0.11));
      h = n * t * t * 1.8;
    }
    pos.setY(i, h);
  }
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({ map: makeGroundTexture(), roughness:1 });
  const terrain = new THREE.Mesh(geo, mat);
  terrain.receiveShadow = true;
  return terrain;
}

function buildCompoundFloor(){
  const geo = new THREE.CircleGeometry(HALF + 5, 48);
  geo.rotateX(-Math.PI/2);
  const mat = new THREE.MeshStandardMaterial({ map: makeCompoundFloorTexture(), roughness:0.95 });
  const floor = new THREE.Mesh(geo, mat);
  floor.position.y = 0.02;
  floor.receiveShadow = true;
  return floor;
}

function buildBoundaryWall(){
  const group = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color:0x4a4a44, roughness:0.85 });
  const segsCount = 28, r = HALF + 4.5;
  for(let i=0;i<segsCount;i++){
    const a = (i/segsCount) * Math.PI*2;
    const geo = new THREE.BoxGeometry(2.6, 1.3, 0.5);
    const seg = new THREE.Mesh(geo, mat);
    seg.position.set(Math.cos(a)*r, 0.65, Math.sin(a)*r);
    seg.rotation.y = -a;
    seg.castShadow = true; seg.receiveShadow = true;
    group.add(seg);
  }
  return group;
}

function scatterProps(){
  const group = new THREE.Group();
  const rockMat = new THREE.MeshStandardMaterial({ color:0x6b6b64, roughness:0.9, flatShading:true });
  const trunkMat = new THREE.MeshStandardMaterial({ color:0x4a3826, roughness:1 });
  const leafMat = new THREE.MeshStandardMaterial({ color:0x3f5230, roughness:0.9, flatShading:true });

  for(let i=0;i<26;i++){
    const a = Math.random()*Math.PI*2;
    const r = HALF + 10 + Math.random()*80;
    const x = Math.cos(a)*r, z = Math.sin(a)*r;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.25,2.2,6), trunkMat);
    trunk.position.set(x, 1.1, z);
    const leaf = new THREE.Mesh(new THREE.ConeGeometry(1.1+Math.random()*0.6, 2.6, 7), leafMat);
    leaf.position.set(x, 3.0, z);
    trunk.castShadow = leaf.castShadow = true;
    group.add(trunk, leaf);
  }
  for(let i=0;i<20;i++){
    const a = Math.random()*Math.PI*2;
    const r = HALF + 6 + Math.random()*90;
    const x = Math.cos(a)*r, z = Math.sin(a)*r;
    const s = 0.5+Math.random()*1.2;
    const rock = new THREE.Mesh(new THREE.IcosahedronGeometry(s,0), rockMat);
    rock.position.set(x, s*0.4, z);
    rock.rotation.set(Math.random(),Math.random(),Math.random());
    rock.castShadow = true; rock.receiveShadow = true;
    group.add(rock);
  }
  const barrelMat = new THREE.MeshStandardMaterial({ color:0x6b4a35, roughness:0.7, metalness:0.2 });
  const barrelSpots = [[-HALF+3,-HALF+3],[HALF-4,-HALF+5],[-HALF+5,HALF-4]];
  barrelSpots.forEach(([bx,bz]) => {
    const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,1.3,10), barrelMat);
    barrel.position.set(bx,0.65,bz);
    barrel.castShadow = true; barrel.receiveShadow = true;
    group.add(barrel);
  });
  return group;
}

function initThree(){
  holder = document.getElementById('canvasHolder');
  clock = new THREE.Clock();
  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x7a6a52, 55, 150);

  camera = new THREE.PerspectiveCamera(45, 680/540, 0.1, 500);
  updateCameraPosition();

  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(680,540);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace || renderer.outputColorSpace;
  holder.appendChild(renderer.domElement);

  scene.add(makeSky());

  const hemi = new THREE.HemisphereLight(0x9db4c9, 0x3a3226, 0.65);
  scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xfff1d8, 1.1);
  dir.position.set(35, 55, 15);
  dir.castShadow = true;
  dir.shadow.mapSize.set(1536,1536);
  dir.shadow.camera.left = -45; dir.shadow.camera.right = 45;
  dir.shadow.camera.top = 45; dir.shadow.camera.bottom = -45;
  dir.shadow.camera.near = 1; dir.shadow.camera.far = 140;
  dir.shadow.bias = -0.0015;
  scene.add(dir);

  scene.add(buildTerrain());
  scene.add(buildCompoundFloor());
  scene.add(buildBoundaryWall());
  scene.add(scatterProps());

  const gridHelper = new THREE.GridHelper(HALF*2, 14, 0x2b2f28, 0x2b2f28);
  gridHelper.position.y = 0.03;
  gridHelper.material.transparent = true;
  gridHelper.material.opacity = 0.25;
  scene.add(gridHelper);

  const crateMat = new THREE.MeshStandardMaterial({ color:0x8a7a4a, roughness:0.8 });
  const sandbagMat = new THREE.MeshStandardMaterial({ color:0x6b6045, roughness:1 });
  obstaclesRaw.forEach((o,idx) => {
    const w = o.w*SCALE, d = o.h*SCALE, h = 1.9;
    const mat = idx % 2 === 0 ? crateMat : sandbagMat;
    const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    const c = toWorld(o.x + o.w/2, o.y + o.h/2);
    box.position.set(c.x, h/2, c.z);
    box.castShadow = true; box.receiveShadow = true;
    scene.add(box);
  });

  meshA = buildAgentMesh(0xe0a458);
  meshB = buildAgentMesh(0x4fb8c9);
  scene.add(meshA.group);
  scene.add(meshB.group);

  holder.addEventListener('mousedown', e => { dragging = true; lastMouse = {x:e.clientX,y:e.clientY}; });
  window.addEventListener('mouseup', () => dragging = false);
  window.addEventListener('mousemove', e => {
    if(!dragging) return;
    const dx = e.clientX - lastMouse.x, dy = e.clientY - lastMouse.y;
    camAngle.theta -= dx*0.006;
    camAngle.phi = clamp(camAngle.phi - dy*0.006, 0.35, 1.4);
    lastMouse = {x:e.clientX,y:e.clientY};
    updateCameraPosition();
  });
  holder.addEventListener('wheel', e => {
    e.preventDefault();
    camAngle.radius = clamp(camAngle.radius + e.deltaY*0.03, 22, 100);
    updateCameraPosition();
  }, { passive:false });

  positionAgentMesh(meshA, state.A, state.B);
  positionAgentMesh(meshB, state.B, state.A);
  animate();
}

function updateCameraPosition(){
  const { theta, phi, radius } = camAngle;
  camera.position.set(
    radius * Math.sin(phi) * Math.cos(theta),
    radius * Math.cos(phi),
    radius * Math.sin(phi) * Math.sin(theta)
  );
  camera.lookAt(0,1.2,0);
}

function buildAgentMesh(color){
  const group = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color, roughness:0.55, metalness:0.1 });
  const darkMat = new THREE.MeshStandardMaterial({ color:0x2a2e33, roughness:0.7 });

  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.85,1.0,0.5), mat);
  torso.position.y = 1.35; torso.castShadow = true;
  group.add(torso);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.32,12,12), mat);
  head.position.y = 2.05; head.castShadow = true;
  group.add(head);

  const legGeo = new THREE.CylinderGeometry(0.15,0.15,0.9,8);
  const legL = new THREE.Mesh(legGeo, darkMat); legL.position.set(-0.22,0.45,0); legL.castShadow = true;
  const legR = new THREE.Mesh(legGeo, darkMat); legR.position.set(0.22,0.45,0); legR.castShadow = true;
  group.add(legL, legR);

  const armGeo = new THREE.CylinderGeometry(0.12,0.12,0.85,8);
  const armL = new THREE.Mesh(armGeo, mat); armL.position.set(-0.58,1.35,0); armL.castShadow = true;
  const armR = new THREE.Mesh(armGeo, mat); armR.position.set(0.58,1.35,0); armR.castShadow = true;
  group.add(armL, armR);

  const gun = new THREE.Mesh(new THREE.BoxGeometry(0.14,0.14,0.9), darkMat);
  gun.position.set(0.58, 1.35, 0.55);
  group.add(gun);

  const ringMat = new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0, side:THREE.DoubleSide });
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.75,1.0,20), ringMat);
  ring.rotation.x = -Math.PI/2; ring.position.y = 0.04;
  group.add(ring);

  return { group, ring, torso, head, legL, legR, armL, armR };
}

function positionAgentMesh(mesh, agentState, enemyState){
  const w = toWorld(agentState.x, agentState.y);
  mesh.group.position.x = w.x;
  mesh.group.position.z = w.z;
  mesh.ring.material.opacity = agentState.cover ? 0.55 : 0;
  if(agentState.hp <= 0){
    mesh.group.rotation.x = Math.PI/2;
    mesh.group.position.y = 0.3;
  } else {
    mesh.group.rotation.x = 0;
    mesh.group.position.y = 0;
    if(enemyState){
      const ew = toWorld(enemyState.x, enemyState.y);
      mesh.group.lookAt(ew.x, mesh.group.position.y, ew.z);
    }
  }
}

function spawnTracer(fromAgent, toAgent, colorHex){
  const from = toWorld(fromAgent.x, fromAgent.y);
  const to = toWorld(toAgent.x, toAgent.y);
  const points = [ new THREE.Vector3(from.x, 1.5, from.z), new THREE.Vector3(to.x, 1.3, to.z) ];
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({ color: colorHex, transparent:true, opacity:1 });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  tracers.push({ line, born: performance.now() });

  const flash = new THREE.PointLight(colorHex, 4, 6);
  flash.position.set(from.x, 1.5, from.z);
  scene.add(flash);
  flashLights.push({ light: flash, born: performance.now() });
}

function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  const t = clock.getElapsedTime();

  for(let i = tracers.length-1; i >= 0; i--){
    const tr = tracers[i];
    const age = now - tr.born;
    if(age > 450){ scene.remove(tr.line); tracers.splice(i,1); }
    else tr.line.material.opacity = 1 - age/450;
  }
  for(let i = flashLights.length-1; i >= 0; i--){
    const f = flashLights[i];
    const age = now - f.born;
    if(age > 120){ scene.remove(f.light); flashLights.splice(i,1); }
    else f.light.intensity = 4 * (1 - age/120);
  }

  [meshA, meshB].forEach((m, idx) => {
    const st = idx === 0 ? state.A : state.B;
    if(st.hp > 0){
      const bob = Math.sin(t*3 + idx*2) * 0.04;
      m.group.position.y = bob;
    }
  });

  renderer.render(scene, camera);
}

// ---------- HUD ----------
function updateHUD(){
  document.getElementById('turnCounter').textContent = `turn ${state.turn} / ${MAX_TURNS}`;
  document.getElementById('hpLabelA').textContent = `${state.A.name} — ${Math.max(0,state.A.hp)}`;
  document.getElementById('hpLabelB').textContent = `${state.B.name} — ${Math.max(0,state.B.hp)}`;
  document.getElementById('hpFillA').style.width = Math.max(0,state.A.hp) + '%';
  document.getElementById('hpFillB').style.width = Math.max(0,state.B.hp) + '%';
  positionAgentMesh(meshA, state.A, state.B);
  positionAgentMesh(meshB, state.B, state.A);
}

function addLog(who, text, reasoning){
  const feed = document.getElementById('logFeed');
  const div = document.createElement('div');
  div.className = 'log-entry ' + who;
  div.innerHTML = `<div class="meta">turn ${state.turn} — ${who === 'a' ? state.A.name : state.B.name}</div>` +
    `<div>${text}</div>` + (reasoning ? `<div class="reasoning">"${reasoning}"</div>` : '');
  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;
}

// Robust JSON parser for LLM responses
function extractJSON(rawText) {
  if (!rawText) return null;
  let clean = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
  try {
    return JSON.parse(clean);
  } catch(e){}
  const match = clean.match(/\{[\s\S]*\}/);
  if (match) {
    try {
      return JSON.parse(match[0]);
    } catch(e){}
  }
  return null;
}

// ---------- AGENT AI CALLS ----------
async function callAgentA(selfState, enemyState, persona, name){
  const d = dist(selfState, enemyState);
  const enemyCover = nearCover(enemyState);
  const prompt = `You are "${name}", an AI combatant in a top-down tactical arena battle (${GRID}x${GRID} grid, origin top-left).
Persona / Strategy: ${persona}

Current status:
- Your state: x=${Math.round(selfState.x)}, y=${Math.round(selfState.y)}, hp=${Math.max(0,selfState.hp)}, ammo=${selfState.ammo}, in_cover=${selfState.cover}
- Enemy state: x=${Math.round(enemyState.x)}, y=${Math.round(enemyState.y)}, hp=${Math.max(0,enemyState.hp)}, distance=${Math.round(d)}, enemy_in_cover=${enemyCover}
- Obstacles (cover positions): ${JSON.stringify(obstaclesRaw)}

Choose exactly ONE action for this turn. Respond with ONLY valid raw JSON, no markdown, no fences:
{"action": "move" | "shoot" | "reload" | "hold_cover", "dx": number, "dy": number, "reasoning": "one short sentence in character"}

Rules:
- "move": dx/dy are the delta to move this turn, each between -40 and 40. Stay within 0-${GRID} bounds.
- "shoot": only useful if ammo > 0. dx/dy can be 0.
- "reload": refills ammo to 30. dx/dy should be 0.
- "hold_cover": stay near current cover, dx/dy small or 0.
Pick the action that fits your persona and the tactical situation.`;

  const model = document.getElementById('modelA').value.trim() || "morriszdweck/osaii-api-smart";
  const apiKey = document.getElementById('keyA').value.trim() || "sk_rCfY3PHvWh9yGcvIokjx1nQtWatKIndV";
  const endpoint = "https://gen.pollinations.ai/v1/chat/completions";

  try{
    const response = await fetch(endpoint, {
      method: "POST",
      headers: { 
        "Content-Type": "application/json",
        "Authorization": `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: model,
        messages: [
          { role: "system", content: "You are an AI player in a tactical arena game. Respond with ONLY a valid JSON object matching the schema. No commentary, no code fences." },
          { role: "user", content: prompt }
        ],
        temperature: 0.5,
        max_tokens: 300
      })
    });
    const data = await response.json();
    const raw = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : '';
    const parsed = extractJSON(raw);
    if(parsed && parsed.action) return parsed;
    console.warn("Pollinations output fallback:", raw);
    return { action: 'shoot', dx:0, dy:0, reasoning: 'Aggressive opening shot' };
  } catch(e){
    console.error('Pollinations agent call failed', e);
    return { action: 'hold_cover', dx:0, dy:0, reasoning: 'Holding position under fire' };
  }
}

async function callAgentB(selfState, enemyState, persona, name){
  const d = dist(selfState, enemyState);
  const enemyCover = nearCover(enemyState);
  const prompt = `You are "${name}", an AI combatant in a top-down tactical arena battle (${GRID}x${GRID} grid, origin top-left).
Persona / Strategy: ${persona}

Current status:
- Your state: x=${Math.round(selfState.x)}, y=${Math.round(selfState.y)}, hp=${Math.max(0,selfState.hp)}, ammo=${selfState.ammo}, in_cover=${selfState.cover}
- Enemy state: x=${Math.round(enemyState.x)}, y=${Math.round(enemyState.y)}, hp=${Math.max(0,enemyState.hp)}, distance=${Math.round(d)}, enemy_in_cover=${enemyCover}
- Obstacles (cover positions): ${JSON.stringify(obstaclesRaw)}

Choose exactly ONE action for this turn. Respond with ONLY valid raw JSON, no markdown, no fences:
{"action": "move" | "shoot" | "reload" | "hold_cover", "dx": number, "dy": number, "reasoning": "one short sentence in character"}

Rules:
- "move": dx/dy are the delta to move this turn, each between -40 and 40. Stay within 0-${GRID} bounds.
- "shoot": only useful if ammo > 0. dx/dy can be 0.

Pick the action that fits your persona and the tactical situation.`;

  const model = document.getElementById('modelB').value.trim() || "openai/gpt-oss-120b";
  const userKey = document.getElementById('keyB').value.trim();
  const keysToTry = userKey ? [userKey, ...groqKeys.filter(k => k !== userKey)] : groqKeys;
  const endpoint = "https://api.groq.com/openai/v1/chat/completions";

  for(let i = 0; i < keysToTry.length; i++){
    const activeKey = keysToTry[(currentGroqKeyIdx + i) % keysToTry.length];
    try{
      const response = await fetch(endpoint, {
        method: "POST",
        headers: { 
          "Content-Type": "application/json",
          "Authorization": `Bearer ${activeKey}`
        },
        body: JSON.stringify({
          model: model,
          messages: [
            { role: "system", content: "You are an AI player in a tactical arena game. Respond with ONLY a valid JSON object matching the schema. No commentary, no code fences." },
            { role: "user", content: prompt }
          ],
          temperature: 0.5,
          max_tokens: 300
        })
      });

      if(!response.ok){
        console.warn(`Groq API key returned status ${response.status}. Trying next key...`);
        continue;
      }

      const data = await response.json();
      const raw = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : '';
      const parsed = extractJSON(raw);
      if(parsed && parsed.action) return parsed;
      console.warn("Groq output fallback:", raw);
      return { action: 'shoot', dx:0, dy:0, reasoning: 'Calculating sniper trajectory' };
    } catch(e){
      console.warn('Groq call error, attempting backup key:', e);
    }
  }

  return { action: 'hold_cover', dx:0, dy:0, reasoning: 'Repositioning behind cover' };
}

function applyAction(selfState, enemyState, action, who){
  action.dx = clamp(Number(action.dx)||0, -40, 40);
  action.dy = clamp(Number(action.dy)||0, -40, 40);
  const colorHex = who === 'a' ? 0xe0a458 : 0x4fb8c9;

  if(action.action === 'move'){
    selfState.x = clamp(selfState.x + action.dx, 12, GRID-12);
    selfState.y = clamp(selfState.y + action.dy, 12, GRID-12);
    selfState.cover = nearCover(selfState);
    addLog(who, `moved to (${Math.round(selfState.x)}, ${Math.round(selfState.y)})${selfState.cover ? ' — found cover' : ''}`, action.reasoning);
  } else if(action.action === 'reload'){
    selfState.ammo = 30;
    addLog(who, 'reloaded — ammo full', action.reasoning);
  } else if(action.action === 'hold_cover'){
    selfState.x = clamp(selfState.x + action.dx*0.3, 12, GRID-12);
    selfState.y = clamp(selfState.y + action.dy*0.3, 12, GRID-12);
    selfState.cover = nearCover(selfState);
    addLog(who, 'holding position' + (selfState.cover ? ' in cover' : ''), action.reasoning);
  } else if(action.action === 'shoot'){
    if(selfState.ammo <= 0){
      addLog(who, 'tried to shoot — out of ammo, forced to reload', action.reasoning);
      selfState.ammo = 30;
      return;
    }
    selfState.ammo -= 1;
    const d = dist(selfState, enemyState);
    let hitChance = 0.85 - d/700;
    if(enemyState.cover) hitChance -= 0.3;
    hitChance = clamp(hitChance, 0.05, 0.9);
    const roll = Math.random();
    spawnTracer(selfState, enemyState, colorHex);
    if(roll < hitChance){
      const dmg = 12 + Math.floor(Math.random()*14);
      enemyState.hp -= dmg;
      addLog(who, `fired at ${d < 150 ? 'close' : d < 300 ? 'medium' : 'long'} range — HIT for ${dmg} dmg (${Math.round(hitChance*100)}% odds)`, action.reasoning);
    } else {
      addLog(who, `fired — MISSED (${Math.round(hitChance*100)}% odds)`, action.reasoning);
    }
  } else {
    addLog(who, 'hesitated', action.reasoning);
  }
}

async function runTurn(){
  if(state.over || !state.running) return;
  state.turn += 1;

  if(state.A.hp > 0){
    document.getElementById('turnCounter').textContent = `turn ${state.turn} / ${MAX_TURNS} · [Agent A thinking...]`;
    const actionA = await callAgentA(state.A, state.B, document.getElementById('stratA').value, state.A.name);
    if(!state.running) return;
    applyAction(state.A, state.B, actionA, 'a');
    updateHUD();
  }
  if(state.B.hp > 0 && !state.over){
    document.getElementById('turnCounter').textContent = `turn ${state.turn} / ${MAX_TURNS} · [Agent B thinking...]`;
    const actionB = await callAgentB(state.B, state.A, document.getElementById('stratB').value, state.B.name);
    if(!state.running) return;
    applyAction(state.B, state.A, actionB, 'b');
    updateHUD();
  }

  checkEnd();
  if(!state.over && state.running){
    const delay = Number(document.getElementById('speedSlider').value);
    setTimeout(runTurn, delay);
  }
}

function checkEnd(){
  const banner = document.getElementById('winnerBanner');
  if(state.A.hp <= 0 || state.B.hp <= 0 || state.turn >= MAX_TURNS){
    state.over = true; state.running = false;
    document.getElementById('startBtn').disabled = false;
    document.getElementById('pauseBtn').disabled = true;
    let html = '';
    if(state.A.hp <= 0 && state.B.hp <= 0){
      html = `<div class="winner-banner draw">Both combatants down — draw</div>`;
    } else if(state.A.hp <= 0){
      html = `<div class="winner-banner b">🏆 ${state.B.name} wins</div>`;
    } else if(state.B.hp <= 0){
      html = `<div class="winner-banner a">🏆 ${state.A.name} wins</div>`;
    } else {
      const winner = state.A.hp >= state.B.hp ? state.A.name : state.B.name;
      const cls = state.A.hp >= state.B.hp ? 'a' : 'b';
      html = `<div class="winner-banner ${cls}">Turn limit reached — ${winner} ahead on HP</div>`;
    }
    banner.innerHTML = html;
    updateHUD();
  }
}

document.getElementById('speedSlider').addEventListener('input', (e) => {
  document.getElementById('speedLabel').textContent = e.target.value + 'ms';
});

document.getElementById('startBtn').addEventListener('click', () => {
  if(state.over || state.turn === 0){
    state = freshState();
    state.A.name = document.getElementById('nameA').value || 'Pollinations';
    state.B.name = document.getElementById('nameB').value || 'Groq';
    document.getElementById('logFeed').innerHTML = '';
    document.getElementById('winnerBanner').innerHTML = '';
    updateHUD();
  }
  state.running = true;
  document.getElementById('startBtn').disabled = true;
  document.getElementById('pauseBtn').disabled = false;
  document.getElementById('startBtn').textContent = 'Start Battle';
  runTurn();
});

document.getElementById('pauseBtn').addEventListener('click', () => {
  state.running = false;
  document.getElementById('startBtn').disabled = false;
  document.getElementById('startBtn').textContent = 'Resume';
  document.getElementById('pauseBtn').disabled = true;
});

document.getElementById('resetBtn').addEventListener('click', () => {
  state = freshState();
  state.A.name = document.getElementById('nameA').value || 'Pollinations';
  state.B.name = document.getElementById('nameB').value || 'Groq';
  document.getElementById('logFeed').innerHTML = '';
  document.getElementById('winnerBanner').innerHTML = '';
  document.getElementById('startBtn').disabled = false;
  document.getElementById('startBtn').textContent = 'Start Battle';
  document.getElementById('pauseBtn').disabled = true;
  updateHUD();
});

initThree();
updateHUD();
</script>
