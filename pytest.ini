[pytest]
pythonpath = .
# Test Discovery Scope
testpaths = scratch
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to ignore
norecursedirs = .agents .git .gemini venv .venv __pycache__ osworld_g_images

# Asyncio Configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Warning Filters
filterwarnings =
    ignore::pytest.PytestDeprecationWarning
    ignore:The configuration option "asyncio_default_fixture_loop_scope" is unset:pytest.PytestDeprecationWarning
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning
    ignore:Mean of empty slice:RuntimeWarning
    ignore:invalid value encountered in scalar divide:RuntimeWarning

# Default Command Line Options and Ignored Live / Benchmark Scripts
addopts =
    -ra
    --ignore=test_json2.py
    --ignore-glob=*test_advanced_features.py
    --ignore-glob=*test_benchmark_sample_ollama.py
    --ignore-glob=*test_blueprint_phases.py
